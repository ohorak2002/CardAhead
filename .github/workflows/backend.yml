name: Impact backend tests
on: [push, pull_request, workflow_dispatch]
jobs:
  authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f backend/tests/bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f backend/migrations/001_impact.sql
      - run: psql -v ON_ERROR_STOP=1 -f backend/tests/authorization.sql
