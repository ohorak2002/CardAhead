name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cardkit:
    name: CardKit unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --package-path Packages/CardKit
      - name: Test
        run: swift test --package-path Packages/CardKit

  app:
    name: iOS app builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project CardRewards.xcodeproj \
            -scheme CardRewards \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  linux:
    name: CardKit on Linux
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test --package-path Packages/CardKit
