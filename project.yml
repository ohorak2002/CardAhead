name: CardWise

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  CardKit:
    path: Packages/CardKit

targets:
  CardWise:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CardKit
        product: CardKit
    settings:
      base:
        # Not com.example.*: Apple registers this identifier against your
        # developer team the first time you install, and the example prefix is
        # so widely used that it is usually already taken by somebody else —
        # which fails the install with a message about the bundle identifier
        # rather than anything to do with this app.
        PRODUCT_BUNDLE_IDENTIFIER: com.ohorak.cardrewards
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
        # AppIcon and AccentColor are single named entries in
        # App/Assets.xcassets; XcodeGen picks up the catalog itself from
        # `sources: - path: App` automatically, but Xcode still has to be
        # told which set is the app icon and which is the global tint.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A billable secret, so it is not in this repository. Empty means the
        # app runs with no place provider and says so. See docs/places-api.md.
        GOOGLE_PLACES_API_KEY: ""
        IMPACT_SERVICE_URL: ""
        IMPACT_PUBLIC_KEY: ""
        # Public web pages, not secrets, shown as links in More > Privacy &
        # legal (an empty value hides the row). Hosted on the portfolio site;
        # the same two addresses go in App Store Connect. If they ever move,
        # leave the old pages redirecting, because shipped builds keep these.
        PRIVACY_POLICY_URL: "https://ohorak2002.github.io/portfolio/cardwise/privacy/"
        SUPPORT_URL: "https://ohorak2002.github.io/portfolio/cardwise/support/"
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: CardWise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GooglePlacesAPIKey: $(GOOGLE_PLACES_API_KEY)
        ImpactServiceURL: $(IMPACT_SERVICE_URL)
        ImpactPublicKey: $(IMPACT_PUBLIC_KEY)
        PrivacyPolicyURL: $(PRIVACY_POLICY_URL)
        SupportURL: $(SUPPORT_URL)
        # Only HTTPS and the Keychain, both exempt from US export
        # documentation. Saying so here stops App Store Connect asking the
        # encryption question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Wired up in build step 4. The copy is deliberately plain: the Always
        # prompt is the biggest drop-off in the funnel and a vague string loses it.
        NSLocationWhenInUseUsageDescription: >-
          Used to show shops near you on the map and tell which shop you are
          in, so CardWise can name the card that earns the most there.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Used to notice when you arrive somewhere and remind you which card to
          pay with, before you take out your phone. Your position is sent to
          Google Places only to find shops nearby; CardWise never uploads a
          history of where you have been.
        # Asked for only when somebody taps "Take a photo" on the card photo
        # screen — never at launch. The string says what the photo is *not*
        # used for as well, because a credit-card app asking for the camera is
        # exactly the prompt a careful person declines.
        NSCameraUsageDescription: >-
          Used only to photograph your own card, so your wallet shows the card
          you actually carry. The photo stays on this iPhone and is never
          uploaded. CardWise does not read your card number.

  CardWiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CardWise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohorak.cardrewards.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CardWise
        CODE_SIGNING_ALLOWED: NO

schemes:
  CardWise:
    build:
      targets:
        CardWise: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CardWiseUITests
    archive:
      config: Release
