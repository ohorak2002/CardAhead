name: CardWise

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  CardKit:
    path: Packages/CardKit

targets:
  CardWise:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CardKit
        product: CardKit
    settings:
      base:
        # Not com.example.*: Apple registers this identifier against your
        # developer team the first time you install, and the example prefix is
        # so widely used that it is usually already taken by somebody else —
        # which fails the install with a message about the bundle identifier
        # rather than anything to do with this app.
        PRODUCT_BUNDLE_IDENTIFIER: com.ohorak.cardrewards
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
        # AppIcon and AccentColor are single named entries in
        # App/Assets.xcassets; XcodeGen picks up the catalog itself from
        # `sources: - path: App` automatically, but Xcode still has to be
        # told which set is the app icon and which is the global tint.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A billable secret, so it is not in this repository. Empty means the
        # app runs with no place provider and says so. See docs/places-api.md.
        GOOGLE_PLACES_API_KEY: ""
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: CardWise
        GooglePlacesAPIKey: $(GOOGLE_PLACES_API_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Wired up in build step 4. The copy is deliberately plain: the Always
        # prompt is the biggest drop-off in the funnel and a vague string loses it.
        NSLocationWhenInUseUsageDescription: >-
          Used to tell which shop you are in, so we can name the card that earns
          the most there.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Used to notice when you arrive somewhere and remind you which card to
          pay with, before you take out your phone. Your location stays on this
          device apart from an anonymous lookup of the shop you are at.
        # Asked for only when somebody taps "Take a photo" on the card photo
        # screen — never at launch. The string says what the photo is *not*
        # used for as well, because a credit-card app asking for the camera is
        # exactly the prompt a careful person declines.
        NSCameraUsageDescription: >-
          Used only to photograph your own card, so your wallet shows the card
          you actually carry. The photo stays on this iPhone and is never
          uploaded. CardWise does not read your card number.
